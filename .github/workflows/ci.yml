name: CI

on:
  pull_request:
  push:
    branches: [main, dev, 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: bash ./gradlew --no-daemon :shared:desktopTest :backend:test
      - name: Desktop and TUI wiring
        env:
          LANGKRAFT_DATA_DIR: ${{ runner.temp }}/langkraft-smoke
        run: |
          bash ./gradlew --no-daemon :shared:run --args=--smoke
          bash ./gradlew --no-daemon :shared:runTui --args=--smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-reports
          path: |
            shared/build/reports/tests/
            backend/build/reports/tests/
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/web-storage-tests/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
        working-directory: tools/web-storage-tests
      - run: npx playwright install --with-deps chromium
        working-directory: tools/web-storage-tests
      - run: bash ./gradlew --no-daemon :webApp:jsBrowserDevelopmentWebpack
      - run: npm test && npm run test:app
        working-directory: tools/web-storage-tests
      - run: bash ./gradlew --no-daemon :webApp:jsBrowserProductionWebpack
      - name: Production browser regression
        run: npm run test:app
        working-directory: tools/web-storage-tests
        env:
          WEB_APP_BUNDLE: ${{ github.workspace }}/webApp/build/kotlin-webpack/js/productionExecutable
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-reports
          path: tools/web-storage-tests/build/app/
