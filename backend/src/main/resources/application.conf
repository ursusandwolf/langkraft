ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ com.langkraft.backend.ApplicationKt.module ]
    }
}

jwt {
    secret = ${?LANGKRAFT_JWT_SECRET}
    issuer = "http://0.0.0.0:8080/"
    audience = "http://0.0.0.0:8080/api"
    realm = "Access to 'api'"
    validity_ms = 86400000 # 24 hours
}

storage {
    data_dir = "data"
    data_dir = ${?LANGKRAFT_BACKEND_DATA_DIR}
    downloads_dir = "downloads"
    downloads_dir = ${?LANGKRAFT_DOWNLOADS_DIR}
}

ingestion {
    cleanup_interval_ms = 3600000 # 1 hour
    job_expiry_ms = 86400000 # 24 hours
    worker_count = 4
    queue_capacity = 8
}
