ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ com.langkraft.backend.ApplicationKt.module ]
    }
}

jwt {
    secret = ${?LANGKRAFT_JWT_SECRET}
    issuer = "http://0.0.0.0:8080/"
    audience = "http://0.0.0.0:8080/api"
    realm = "Access to 'api'"
    validity_ms = 86400000 # 24 hours
}

storage {
    data_dir = "data"
    data_dir = ${?LANGKRAFT_BACKEND_DATA_DIR}
    downloads_dir = "downloads"
    downloads_dir = ${?LANGKRAFT_DOWNLOADS_DIR}
    # Opt in: 0 preserves server audio indefinitely. Applies only to managed new imports.
    media_retention_ms = 0
    media_retention_ms = ${?LANGKRAFT_MEDIA_RETENTION_MS}
    max_import_bytes = 0 # Opt in; counts all intermediate media and process logs per job.
    max_import_bytes = ${?LANGKRAFT_MAX_IMPORT_BYTES}
    max_total_bytes = 0 # Requires a positive max_import_bytes when enabled.
    max_total_bytes = ${?LANGKRAFT_MAX_TOTAL_BYTES}
    budget_check_interval_ms = 200
    budget_check_interval_ms = ${?LANGKRAFT_BUDGET_CHECK_INTERVAL_MS}
}

ingestion {
    cleanup_interval_ms = 3600000 # 1 hour
    job_expiry_ms = 86400000 # 24 hours
    worker_count = 4
    queue_capacity = 8
    max_duration_seconds = 14400
    max_duration_seconds = ${?LANGKRAFT_MAX_DURATION_SECONDS}
}
